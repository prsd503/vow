<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Watcher - Facility Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <style>
        body { font-family: sans-serif; background-color: #fdf6e3; padding: 20px; color: #5d4037; }
        .brown-theme { background-color: #efebe9; padding: 20px; border-radius: 20px; border: 2px solid #8d6e63; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.2); }
        #calendar { background: white; padding: 10px; border-radius: 12px; margin-bottom: 20px; }
        .brand-header { font-family: 'Caveat', cursive; text-align: center; color: #5d4037; font-size: 32px; margin-bottom: 5px; }
        h1 { text-align: center; font-size: 20px; color: #3e2723; margin-top: 0; }
        #eventDetails { background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #d7ccc8; text-align: center; display: none; color: #5d4037; }
        .fc .fc-toolbar-title { font-size: 1.2rem !important; color: #3e2723; }
        
        .fc .fc-button-primary {
            background-color: #8d6e63 !important;
            border-color: #8d6e63 !important;
        }
        .fc .fc-button-primary:hover {
            background-color: #6d4c41 !important;
        }
        
        .fc-event { display: none !important; }

        .booking-count-badge {
            background-color: #8d6e63;
            color: white;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.75rem;
            margin-top: 4px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
        }

        .back-btn { background: #8d6e63; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; font-family: 'Caveat', cursive; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: #6d4c41; }
        
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="brown-theme" style="margin-top: 50px;">
    
    <div class="brand-header">
       Owl Watcher
    </div>
    <h1 id="societyHeader">Initializing...</h1>
    
    <div id="eventDetails">
        <div id="dispSummaryContent"></div>
        <div id="adminContactContainer" style="margin-top: 15px;"></div>
    </div>

    <div id='calendar'></div>

    <div style="text-align: center; margin-top: 15px;">
        <a href="index.html" class="back-btn">Back</a>
    </div>
</div>

<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
    const API_BASE_URL = 'https://api.owlwatcher.tech/api';
    const NG_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

    let facilityMap = {};
    let allLoadedBookings = [];
    let societyAdminPhone = ""; 

    async function getAuthHeaders() {
        try {
            const tokenRes = await fetch(`${API_BASE_URL}/auth/token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...NG_HEADERS }
            });
            const tokenData = await tokenRes.json();
            if (tokenData && tokenData.token) {
                return {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tokenData.token}`,
                    ...NG_HEADERS
                };
            }
        } catch (err) {
            console.error("Failed to acquire auth token:", err);
        }
        return { ...NG_HEADERS };
    }

    function formatTimeString(isoString) {
        if (!isoString) return '';
        const timePart = isoString.split('T')[1];
        if (!timePart) return '';
        const [hour, minute] = timePart.split(':');
        const h = parseInt(hour, 10);
        const ampm = h >= 12 ? 'pm' : 'am';
        const formattedHour = h % 12 || 12;
        return `${formattedHour}:${minute} ${ampm}`;
    }

    function isSameDate(dateString, targetDateStr) {
        if (!dateString) return false;
        const bookingDateOnly = dateString.split('T')[0];
        return bookingDateOnly === targetDateStr;
    }

    function showSummaryForDate(dateStr, bookings) {
        const summaryContent = document.getElementById('dispSummaryContent');
        const adminContactContainer = document.getElementById('adminContactContainer');
        
        let html = `<div style="font-size: 0.85rem; color: #7f8c8d; margin-bottom: 5px;"><b>${dateStr}</b></div>`;
        
        if (bookings.length > 0) {
            html += `<strong>Bookings Summary:</strong><br>`;
            bookings.forEach(b => {
                const readableName = facilityMap[b.facilityId] || b.facilityId;
                const startTime = formatTimeString(b.start);
                const endTime = formatTimeString(b.end);
                html += `
                    <div style="background: #f4ece0; padding: 6px; margin-top: 5px; border-radius: 6px; font-size: 0.9rem; text-align: left;">
                        <b>${readableName}</b><br>
                        <span>${startTime} - ${endTime}</span>
                    </div>
                `;
            });
        } else {
            html += `<p style="color: #7f8c8d; font-size: 0.95rem; margin: 5px 0;">No bookings on this day.</p>`;
        }

        summaryContent.innerHTML = html;

        if (societyAdminPhone) {
            const formattedPhone = societyAdminPhone.replace(/\D/g, '');
            const msgText = bookings.length > 0 
                ? `Hi, I have an inquiry regarding bookings on ${dateStr}.` 
                : `Hi, I want to book a facility on ${dateStr}. Please assist.`;
            
            const encodedMsg = encodeURIComponent(msgText);
            adminContactContainer.innerHTML = `
                <a href="https://wa.me/${formattedPhone}?text=${encodedMsg}" target="_blank" class="whatsapp-btn">
                    💬 Contact Admin via WhatsApp
                </a>
            `;
        } else {
            adminContactContainer.innerHTML = `<p style="color: #c0392b; font-size: 0.85rem;">Admin contact not available.</p>`;
        }

        document.getElementById('eventDetails').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const header = document.getElementById('societyHeader');
        
        const urlParams = new URLSearchParams(window.location.search);
        let societyId = urlParams.get('societyId') || urlParams.get('society') || localStorage.getItem('savedSocietyId') || localStorage.getItem('selectedSociety') || 'Aangan';
        let societyName = urlParams.get('societyName') || localStorage.getItem('savedSocietyName') || societyId;

        if (!societyId) {
            header.innerText = "Error: No society selected";
            return;
        }

        header.innerText = `${societyName} Facility Calendar`;

        try {
            const headers = await getAuthHeaders();
            
            const facRes = await fetch(`${API_BASE_URL}/facilities/${encodeURIComponent(societyId)}`, { headers });
            if (facRes.ok) {
                facilityMap = await facRes.json();
            }

            const adminRes = await fetch(`${API_BASE_URL}/admins?society=${encodeURIComponent(societyName)}`, { headers });
            if (adminRes.ok) {
                const adminData = await adminRes.json();
                societyAdminPhone = adminData.phone || "";
            }
        } catch (e) { 
            console.error("Error loading metadata from API:", e); 
        }

        try {
            const headers = await getAuthHeaders();
            
            let bookingsRes = await fetch(`${API_BASE_URL}/bookings?society=${encodeURIComponent(societyId)}`, { headers });
            if (bookingsRes.ok) {
                const rawBookings = await bookingsRes.json();
                allLoadedBookings = Array.isArray(rawBookings) ? rawBookings : [];
            }
            
            if (allLoadedBookings.length === 0 && societyId.toLowerCase() === 'aangan') {
                const fallbackRes = await fetch(`${API_BASE_URL}/bookings?society=Aangan`, { headers });
                if (fallbackRes.ok) {
                    const fallbackData = await fallbackRes.json();
                    if (Array.isArray(fallbackData) && fallbackData.length > 0) {
                        allLoadedBookings = fallbackData;
                    }
                }
            }
        } catch (e) { 
            console.error("Error loading bookings from API:", e); 
        }

        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: { left: 'prev,today,next', center: 'title', right: '' },
            
            dayCellDidMount: (info) => {
                const cellDateStr = info.date.toLocaleDateString('en-CA');
                const dayBookings = allLoadedBookings.filter(b => isSameDate(b.start, cellDateStr));

                if (dayBookings.length > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'booking-count-badge';
                    badge.innerText = `${dayBookings.length}📒`;
                    
                    badge.addEventListener('click', (e) => {
                        e.stopPropagation();
                        showSummaryForDate(cellDateStr, dayBookings);
                    });

                    info.el.querySelector('.fc-daygrid-day-frame').appendChild(badge);
                }
            },

            dateClick: (info) => {
                const dayBookings = allLoadedBookings.filter(b => isSameDate(b.start, info.dateStr));
                showSummaryForDate(info.dateStr, dayBookings);
            }
        });
        calendar.render();
    });
</script>

<div style="text-align: center; width: 100%; margin-top: 15px; font-size: 0.85rem; color: #7f8c8d;">
    ⚠️ Disclaimer: Automatically deletes bookings older than 7 days and bookings allowed to show till next 6 months only.
</div>

  <!-- Owl Interactive Effect Widget -->
   <div id="owl-container">
    <div id="owl-icon" onclick="activateOwlEffect()">
        <img src="owl.png" alt="Owl Icon" style="width: 55px; height: 55px; object-fit: contain;"> 
    </div>
    <audio id="owl-audio" src="theme.mp3" preload="auto"></audio>
</div>


<style>
  #owl-container { position: fixed; bottom: 30px; right: 30px; z-index: 999; }
  #owl-icon { font-size: 60px; cursor: pointer; user-select: none; transition: transform 0.3s ease; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2)); }
  #owl-icon:hover { transform: scale(1.15); }
  @keyframes enlargeAndShrinkTwice {
    0% { transform: scale(1); }
    25% { transform: scale(1.6); }
    50% { transform: scale(1); }
    75% { transform: scale(1.6); }
    100% { transform: scale(1); }
  }
  .active-effect { animation: enlargeAndShrinkTwice 2s ease-in-out forwards; }
</style>

<script>
  function activateOwlEffect() {
    const container = document.getElementById('owl-container');
    const audio = document.getElementById('owl-audio');
    if (container.classList.contains('active-effect')) return;
    audio.currentTime = 0;
    audio.play().catch(error => {
      console.log("Audio playback blocked or file not found:", error);
    });
    container.classList.add('active-effect');
    setTimeout(() => {
      container.classList.remove('active-effect');
    }, 2000);
  }
</script>        

</body>
</html>
